<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Z Chat</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <style>
    :root{
      --acc:#D97132;--acc2:#BF5A0C;--acc-l:rgba(217,113,50,.12);
      --txt:#1C1C1E;--txt2:#636366;--txt3:#AEAEB2;
      --danger:#FF3B30;--ok:#34C759;--blur:24px;
      --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',system-ui,sans-serif;
      --mono:ui-monospace,'SF Mono','Fira Code',monospace;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden}
    body{font-family:var(--sans);color:var(--txt);display:flex;position:relative;
      background:radial-gradient(ellipse 65% 80% at 12% 50%,rgba(232,118,26,.14) 0%,transparent 60%),
        radial-gradient(ellipse 50% 55% at 88% 15%,rgba(255,160,60,.09) 0%,transparent 55%),
        linear-gradient(145deg,#FFF7F2 0%,#FFEDDE 48%,#FFF4EE 100%);}

    /* SIDEBAR */
    #sb{width:240px;min-width:240px;height:100vh;display:flex;flex-direction:column;
      background:rgba(255,248,243,.8);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));
      border-right:1px solid rgba(217,113,50,.11)}
    .sb-head{padding:20px 18px 16px;display:flex;align-items:center;border-bottom:1px solid rgba(217,113,50,.09)}
    .logo{display:flex;align-items:baseline;gap:0;line-height:1;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}
    .logo-z{font-size:22px;font-weight:100;color:#C4620E;letter-spacing:-.5px}
    .logo-slash{font-size:16px;font-weight:100;color:#AEAEB2;margin:0 5px}
    .logo-chat{font-size:16px;font-weight:100;color:#636366;letter-spacing:-.2px}
    .ic-btn{background:none;border:none;color:var(--txt2);cursor:pointer;padding:6px;border-radius:9px;font-size:16px;transition:all .2s;line-height:1}
    .ic-btn:hover{background:var(--acc-l);color:var(--acc);transform:scale(1.08)}
    .sb-foot{padding:10px 14px;border-top:1px solid rgba(217,113,50,.07);flex-shrink:0}
    .st-btn{background:none;border:none;color:var(--txt3);cursor:pointer;padding:7px;border-radius:9px;font-size:17px;line-height:1;opacity:.7;transition:all .2s}
    .st-btn:hover{background:var(--acc-l);color:var(--acc);opacity:1}
    .mode-row{padding:10px 14px;border-bottom:1px solid rgba(217,113,50,.07);position:relative}
    .mode-track{display:flex;align-items:center;background:rgba(0,0,0,.06);border-radius:14px;padding:4px;position:relative}
    .mode-pill{position:absolute;top:4px;bottom:4px;border-radius:10px;background:#C4620E;box-shadow:0 2px 8px rgba(196,98,14,.28);transition:all .26s cubic-bezier(.4,0,.2,1);pointer-events:none}
    .m-btn{flex:1;padding:9px 10px;background:none;border:none;cursor:pointer;font-size:13px;font-weight:500;font-family:var(--sans);display:flex;align-items:center;justify-content:center;gap:7px;border-radius:10px;position:relative;z-index:1;transition:color .2s}
    .m-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
    .m-btn#btn-chat{color:var(--txt3)}
    .m-btn#btn-chat.on{color:#fff}
    .m-btn#btn-cmp{color:var(--txt3);font-size:12px;font-weight:400}
    .m-btn#btn-cmp.on{color:#C4620E}
    .new-btn{margin:10px 12px;padding:9px 14px;background:var(--acc-l);border:1.5px dashed rgba(217,113,50,.28);color:var(--acc);border-radius:11px;cursor:pointer;font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;transition:all .22s;font-family:var(--sans)}
    .new-btn:hover{background:var(--acc);color:#fff;border-color:transparent;transform:translateY(-1px);box-shadow:0 4px 14px rgba(217,113,50,.28)}
    #cv-list{flex:1;overflow-y:auto;padding:4px 8px}
    .cv-item{padding:9px 10px;border-radius:10px;cursor:pointer;font-size:13px;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .18s;margin-bottom:2px;display:flex;justify-content:space-between;align-items:center}
    .cv-item:hover{background:var(--acc-l);color:var(--txt)}
    .cv-item.on{background:var(--acc-l);color:var(--acc);font-weight:500}
    .cv-del{display:none;background:none;border:none;color:var(--txt3);cursor:pointer;font-size:13px;padding:0 2px;transition:color .15s;flex-shrink:0}
    .cv-item:hover .cv-del,.cv-item.on .cv-del{display:block}
    .cv-del:hover{color:var(--danger)}

    /* HEADER */
    #hdr{padding:11px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
      background:rgba(255,248,243,.84);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));
      border-bottom:1px solid rgba(217,113,50,.1);min-height:48px}
    #hdr-summary{font-size:14px;font-weight:500;color:var(--txt2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #hdr-summary.active{color:var(--txt);font-weight:600;animation:smIn .4s ease-out}
    @keyframes smIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}
    .hdr-r{display:flex;align-items:center;gap:8px;flex-shrink:0}
    .ref-btn{background:rgba(255,255,255,.74);border:1px solid rgba(217,113,50,.16);color:var(--txt2);border-radius:9px;padding:5px 10px;cursor:pointer;font-size:12px;font-weight:500;font-family:var(--sans);transition:all .2s}
    .ref-btn:hover{background:var(--acc-l);border-color:var(--acc);color:var(--acc)}
    .hdr-status{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--txt3);font-weight:500}
    .dot{width:6px;height:6px;border-radius:50%;background:var(--txt3);flex-shrink:0}
    .dot.ok{background:var(--ok);box-shadow:0 0 5px rgba(52,199,89,.45)}
    .dot.ld{background:#FF9500;animation:pl 1s ease-in-out infinite}
    .dot.err{background:var(--danger)}
    @keyframes pl{0%,100%{opacity:1}50%{opacity:.2}}

    /* MAIN */
    #main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden}

    /* CHAT */
    #cp{flex:1;display:flex;flex-direction:column;overflow:hidden}
    #ca{flex:1;overflow-y:auto;padding:22px 20px;display:flex;flex-direction:column;gap:14px;background:rgba(255,255,255,.78)}
    .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--txt3);gap:6px}
    .empty-t{font-size:24px;font-weight:200;color:var(--txt2);letter-spacing:-.3px;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}
    .empty-s{font-size:13px;color:var(--txt3)}
    .msg{display:flex;flex-direction:column;gap:4px;max-width:84%;animation:msgIn .32s cubic-bezier(.34,1.56,.64,1) both}
    .msg.user{align-self:flex-end}
    .msg.assistant{align-self:flex-start;max-width:91%}
    @keyframes msgIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
    .msg-lbl{font-size:11px;color:var(--txt3);padding:0 4px;font-weight:500}
    .msg-b{padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.68;word-break:break-word}
    .msg.user .msg-b{background:linear-gradient(145deg,#D97132,#BF5A0C);color:#fff;border-radius:16px 16px 4px 16px;box-shadow:0 4px 18px rgba(217,113,50,.28)}
    .msg.assistant .msg-b{background:rgba(255,255,255,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.65);border-radius:16px 16px 16px 4px;box-shadow:0 2px 14px rgba(0,0,0,.06)}
    .ci{animation:ci .25s ease-out both;display:inline}
    @keyframes ci{from{opacity:0;filter:blur(4px)}to{opacity:1;filter:blur(0)}}
    .md-done{animation:mdFade .22s ease-out}
    @keyframes mdFade{from{opacity:.6}to{opacity:1}}
    .cur{display:inline-block;width:2px;height:14px;background:var(--acc);margin-left:1px;vertical-align:middle;border-radius:1px;animation:bk 1s step-end infinite}
    @keyframes bk{50%{opacity:0}}
    .msg-b p{margin-bottom:8px}.msg-b p:last-child{margin-bottom:0}
    .msg-b code{background:rgba(0,0,0,.07);border-radius:5px;padding:1px 5px;font-family:var(--mono);font-size:12px}
    .msg.user .msg-b code{background:rgba(255,255,255,.22)}
    .msg-b pre{background:rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.07);border-radius:11px;padding:13px;overflow-x:auto;margin:8px 0}
    .msg-b pre code{background:none;padding:0}
    .msg-b ul,.msg-b ol{padding-left:18px;margin:6px 0}.msg-b li{margin-bottom:3px}
    .msg-b h1,.msg-b h2,.msg-b h3{margin:10px 0 5px;font-weight:600}
    .msg-b table{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px}
    .msg-b th,.msg-b td{border:1px solid rgba(0,0,0,.08);padding:6px 10px}
    .msg-b th{background:rgba(0,0,0,.04);font-weight:600}
    .msg-b blockquote{border-left:3px solid rgba(217,113,50,.4);padding-left:10px;color:var(--txt2);margin:6px 0}
    .msg-b a{color:var(--acc)}
    .msg-imgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
    .msg-img{max-width:180px;max-height:150px;border-radius:10px;object-fit:cover;box-shadow:0 2px 8px rgba(0,0,0,.1)}
    .msg-file{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.06);border-radius:8px;padding:5px 10px;font-size:12px;margin-top:4px}
    .msg.user .msg-file{background:rgba(255,255,255,.2)}

    /* INPUT AREA */
    #ia{padding:10px 16px 14px;flex-shrink:0;
      background:rgba(255,248,243,.92);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));
      border-top:1px solid rgba(217,113,50,.09)}
    #files-preview{display:none;flex-wrap:wrap;gap:6px;margin-bottom:9px}
    #files-preview.show{display:flex}
    .fchip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.82);border:1px solid rgba(217,113,50,.16);border-radius:9px;padding:5px 8px;font-size:12px;color:var(--txt2);max-width:180px}
    .fchip-img{width:30px;height:30px;border-radius:5px;object-fit:cover;flex-shrink:0}
    .fchip-icon{width:30px;height:30px;border-radius:5px;background:rgba(217,113,50,.12);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
    .fchip-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-weight:500}
    .fchip-rm{background:none;border:none;color:var(--txt3);cursor:pointer;font-size:13px;padding:0;flex-shrink:0;line-height:1;transition:color .15s}
    .fchip-rm:hover{color:var(--danger)}
    .ia-row{display:flex;gap:7px;align-items:flex-end}

    /* + button */
    #pw{position:relative;flex-shrink:0}
    .plus-btn{width:44px;height:44px;border-radius:12px;cursor:pointer;
      background:rgba(255,255,255,.75);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      border:1px solid rgba(217,113,50,.18);color:var(--txt2);font-size:22px;font-weight:300;
      display:flex;align-items:center;justify-content:center;transition:all .2s;line-height:1;flex-shrink:0}
    .plus-btn:hover,.plus-btn.open{background:var(--acc-l);border-color:var(--acc);color:var(--acc)}
    #pm{display:none;position:absolute;bottom:calc(100% + 8px);left:0;
      background:rgba(255,252,249,.97);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
      border:1px solid rgba(217,113,50,.12);border-radius:13px;padding:6px;min-width:170px;
      box-shadow:0 8px 32px rgba(0,0,0,.12);z-index:100;animation:mIn .2s cubic-bezier(.34,1.56,.64,1)}
    #pm.show{display:block}
    @keyframes mIn{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
    .pm-item{padding:9px 13px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;display:flex;align-items:center;gap:9px;transition:all .15s;color:var(--txt2);border:none;background:none;width:100%;text-align:left;font-family:var(--sans)}
    .pm-item:hover{background:var(--acc-l);color:var(--acc)}

    /* Textarea */
    #mi{flex:1;background:rgba(255,255,255,.9);border:1px solid rgba(217,113,50,.16);color:var(--txt);
      border-radius:13px;padding:11px 14px;font-size:14px;font-family:var(--sans);
      resize:none;min-height:44px;max-height:150px;line-height:1.5;
      transition:border-color .2s,box-shadow .2s;box-shadow:0 1px 4px rgba(217,113,50,.06);
      overflow-y:auto;scrollbar-width:none}
    #mi::-webkit-scrollbar{display:none}
    #mi:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(217,113,50,.11)}
    #mi::placeholder{color:var(--txt3)}

    /* Model picker */
    #mw{position:relative;flex-shrink:0}
    #mp{height:44px;padding:0 10px 0 12px;
      background:rgba(255,255,255,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      border:1px solid rgba(217,113,50,.18);border-radius:12px;cursor:pointer;
      display:flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--txt2);
      max-width:155px;transition:all .2s;white-space:nowrap}
    #mp:hover,#mp.open{background:var(--acc-l);border-color:var(--acc);color:var(--acc)}
    #mc{overflow:hidden;text-overflow:ellipsis;flex:1;max-width:115px}
    .chv{flex-shrink:0;opacity:.6;transition:transform .2s}
    #mp.open .chv{transform:rotate(180deg)}
    #ml{display:none;position:absolute;bottom:calc(100% + 8px);right:0;
      background:rgba(255,252,249,.97);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
      border:1px solid rgba(217,113,50,.12);border-radius:13px;padding:6px;
      min-width:220px;max-height:280px;overflow-y:auto;
      box-shadow:0 8px 32px rgba(0,0,0,.13);z-index:100;animation:mIn .2s cubic-bezier(.34,1.56,.64,1)}
    #ml.show{display:block}
    .mopt{padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--txt2);transition:all .15s;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mopt:hover{background:var(--acc-l);color:var(--acc)}
    .mopt.on{color:var(--acc)}

    /* Web search + send */
    .ws-btn{width:44px;height:44px;border-radius:12px;cursor:pointer;background:rgba(255,255,255,.8);border:1px solid rgba(217,113,50,.16);color:var(--txt2);display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
    .ws-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    .ws-btn:hover{background:var(--acc-l);border-color:var(--acc);transform:scale(1.06)}
    .ws-btn.on{background:rgba(217,113,50,.15);border-color:var(--acc);color:var(--acc)}
    /* Drag & drop overlay */
    #drag-overlay{display:none;position:fixed;inset:0;z-index:300;background:rgba(217,113,50,.08);border:2.5px dashed rgba(196,98,14,.45);border-radius:16px;margin:8px;backdrop-filter:blur(2px);align-items:center;justify-content:center;flex-direction:column;gap:10px;pointer-events:none}
    #drag-overlay.show{display:flex}
    .drag-icon{width:56px;height:56px;border-radius:16px;background:rgba(217,113,50,.12);display:flex;align-items:center;justify-content:center}
    .drag-icon svg{width:26px;height:26px;stroke:#C4620E;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    .drag-text{font-size:15px;font-weight:500;color:#C4620E}
    .send-btn{width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
      background:linear-gradient(145deg,#D97132,#BF5A0C);color:#fff;
      display:flex;align-items:center;justify-content:center;
      transition:all .22s;box-shadow:0 2px 10px rgba(217,113,50,.35);flex-shrink:0}
    .send-btn:hover{transform:scale(1.08);box-shadow:0 5px 18px rgba(217,113,50,.42)}
    .send-btn:active{transform:scale(.96)}
    .send-btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
    .send-btn.stop{background:linear-gradient(145deg,#FF3B30,#D42020)}
    .send-btn.stop:hover{box-shadow:0 5px 18px rgba(255,59,48,.42)}
    .edit-btn{background:none;border:1px solid rgba(217,113,50,.22);color:var(--acc);border-radius:8px;padding:4px 11px;font-size:12px;cursor:pointer;margin-top:6px;transition:all .18s;font-family:var(--sans);font-weight:500;align-self:flex-end;opacity:0}
    .msg:hover .edit-btn{opacity:1}
    .edit-btn.visible{opacity:1}
    .edit-btn:hover{background:var(--acc-l)}

    /* COMPARE */
    #cmp{display:none;flex:1;flex-direction:column;overflow:hidden;background:rgba(255,255,255,.78)}
    #cmp-ms{padding:14px 16px;flex:1;overflow-y:auto;scrollbar-width:none}
    #cmp-ms::-webkit-scrollbar{display:none}
    .cml{font-size:11px;color:var(--txt3);font-weight:500;letter-spacing:.04em;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
    #cmp-count{font-size:11px;color:var(--txt3)}
    #mt{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:7px}
    .m-tag{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:rgba(255,255,255,.9);border:1px solid rgba(217,113,50,.14);border-radius:10px;padding:12px 8px;font-size:11px;font-weight:500;cursor:pointer;transition:all .18s;color:var(--txt2);user-select:none;text-align:center;line-height:1.35;min-height:56px}
    .m-tag:hover{border-color:rgba(196,98,14,.4);background:#fff;color:var(--txt)}
    .m-tag.on{background:rgba(217,113,50,.1);border-color:#C4620E;color:#C4620E;font-weight:600}
    .m-tag .chk{width:16px;height:16px;border-radius:50%;border:1.5px solid rgba(217,113,50,.3);margin-bottom:2px;display:flex;align-items:center;justify-content:center;transition:all .18s;flex-shrink:0}
    .m-tag.on .chk{background:#C4620E;border-color:#C4620E}
    .m-tag input{display:none}
    #cmp-ia{padding:11px 16px;border-top:1px solid rgba(217,113,50,.09);display:flex;gap:8px;align-items:flex-end;flex-shrink:0;background:rgba(255,248,243,.92);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur))}
    #cmp-in{flex:1;background:rgba(255,255,255,.9);border:1px solid rgba(217,113,50,.15);color:var(--txt);border-radius:12px;padding:10px 13px;font-size:14px;font-family:var(--sans);resize:none;min-height:56px;max-height:120px;transition:all .2s;scrollbar-width:none}
    #cmp-in::-webkit-scrollbar{display:none}
    #cmp-in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(217,113,50,.11)}
    #cmp-in::placeholder{color:var(--txt3)}
    .cmp-send{background:linear-gradient(145deg,#D97132,#BF5A0C);border:none;color:#fff;border-radius:12px;padding:0 20px;cursor:pointer;font-size:14px;font-weight:600;transition:all .22s;font-family:var(--sans);box-shadow:0 2px 10px rgba(217,113,50,.32);height:44px;white-space:nowrap;flex-shrink:0}
    .cmp-send:hover{transform:translateY(-1px);box-shadow:0 5px 18px rgba(217,113,50,.38)}
    .cmp-send:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
    #cmp-res{display:none;flex:1;overflow:hidden}
    #cmp-res.has-results{display:flex}
    .cc{flex:1;border-right:1px solid rgba(217,113,50,.08);display:flex;flex-direction:column;overflow:hidden;min-width:0}
    .cc:last-child{border-right:none}
    .cc-h{padding:9px 14px;border-bottom:1px solid rgba(217,113,50,.08);font-size:12px;font-weight:600;color:var(--acc);background:rgba(255,248,243,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
    .cc-b{flex:1;overflow-y:auto;padding:14px;font-size:13px;line-height:1.68}
    .cc-b p{margin-bottom:7px}.cc-b p:last-child{margin-bottom:0}
    .cc-b code{background:rgba(0,0,0,.06);border-radius:4px;padding:1px 4px;font-family:var(--mono);font-size:11px}
    .cc-b pre{background:rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.06);border-radius:9px;padding:10px;overflow-x:auto;margin:6px 0}

    /* STATUS BAR */
    #stb{padding:4px 18px;font-size:11px;color:var(--txt3);font-weight:500;display:flex;align-items:center;gap:7px;flex-shrink:0;background:rgba(255,248,243,.92);border-top:1px solid rgba(217,113,50,.06)}

    /* SETTINGS */
    #ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:200;align-items:center;justify-content:center}
    #ov.on{display:flex}
    .sp{background:rgba(255,252,249,.97);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border:1px solid rgba(255,255,255,.88);border-radius:22px;padding:28px;width:480px;max-width:92vw;box-shadow:0 28px 72px rgba(0,0,0,.14);animation:spIn .3s cubic-bezier(.34,1.56,.64,1) both}
    @keyframes spIn{from{opacity:0;transform:scale(.93) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}
    .sp-title{font-size:18px;font-weight:700;margin-bottom:22px;letter-spacing:-.3px}
    .sp-title span{background:linear-gradient(135deg,#D97132,#E8A060);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .fg{margin-bottom:16px}
    .fl{display:block;font-size:12px;font-weight:600;color:var(--txt2);margin-bottom:6px;letter-spacing:.02em}
    .fi{width:100%;background:rgba(255,255,255,.85);border:1px solid rgba(217,113,50,.18);color:var(--txt);border-radius:10px;padding:10px 13px;font-size:14px;font-family:var(--sans);transition:all .2s}
    .fi:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(217,113,50,.13)}
    .fi::placeholder{color:var(--txt3)}
    .fi-hint{font-size:11px;color:var(--txt3);margin-top:4px}
    .sp-ft{display:flex;gap:8px;justify-content:flex-end;margin-top:24px}
    .cn-btn{background:rgba(0,0,0,.06);border:none;color:var(--txt2);border-radius:10px;padding:9px 18px;cursor:pointer;font-size:14px;font-weight:500;font-family:var(--sans);transition:all .2s}
    .cn-btn:hover{background:rgba(0,0,0,.1)}
    .sv-btn{background:linear-gradient(135deg,#D97132,#BF5A0C);border:none;color:#fff;border-radius:10px;padding:9px 22px;cursor:pointer;font-size:14px;font-weight:600;font-family:var(--sans);transition:all .2s;box-shadow:0 2px 10px rgba(217,113,50,.3)}
    .sv-btn:hover{transform:translateY(-1px);box-shadow:0 5px 18px rgba(217,113,50,.38)}
    ::-webkit-scrollbar{width:4px;height:4px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:rgba(217,113,50,.22);border-radius:2px}
    ::-webkit-scrollbar-thumb:hover{background:rgba(217,113,50,.4)}
  </style>
</head>
<body>

<div id="sb">
  <div class="sb-head">
    <div class="logo">
      <span class="logo-z">Z</span>
      <span class="logo-slash">/</span>
      <span class="logo-chat">Chat</span>
    </div>
  </div>
  <div class="mode-row">
    <div class="mode-track">
      <div class="mode-pill" id="mode-pill"></div>
      <button class="m-btn on" id="btn-chat" onclick="setMode('chat')">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Chat
      </button>
      <button class="m-btn" id="btn-cmp" onclick="setMode('cmp')">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/></svg>
        Compare
      </button>
    </div>
  </div>
  <button class="new-btn" id="nb" onclick="newCV()">＋ 新建对话</button>
  <div id="cv-list"></div>
  <div class="sb-foot">
    <button class="st-btn" onclick="openSt()" title="设置">⚙</button>
  </div>
</div>

<div id="main">
  <div id="hdr">
    <div id="hdr-summary"></div>
    <div class="hdr-r">
      <button class="ref-btn" onclick="fetchModels()" id="rb">↻ 刷新</button>
      <div class="hdr-status">
        <div class="dot" id="dt"></div>
        <span id="st">未配置</span>
      </div>
    </div>
  </div>

  <div id="cp">
    <div id="ca">
      <div class="empty">
        <div class="empty-t" id="greeting">开始对话</div>
        <div class="empty-s">选择模型，或点击 ⚙ 配置 Z / Chat</div>
      </div>
    </div>
    <div id="ia">
      <div id="files-preview"></div>
      <div class="ia-row">
        <div id="pw">
          <button class="plus-btn" id="pb" onclick="togglePlus(event)">+</button>
          <div id="pm">
            <input type="file" id="fi-img" accept="image/*" multiple style="display:none" onchange="onImgSel(event)">
            <input type="file" id="fi-pdf" accept=".pdf,application/pdf" style="display:none" onchange="onPdfSel(event)">
            <button class="pm-item" onclick="el('fi-img').click();closePlus()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              上传图片
            </button>
            <button class="pm-item" onclick="el('fi-pdf').click();closePlus()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg>
              上传文件
            </button>
          </div>
        </div>
        <textarea id="mi" placeholder="输入消息…" rows="1" onkeydown="onKey(event)" oninput="rsz(this)"></textarea>
        <div id="mw">
          <div id="mp" onclick="toggleModel(event)">
            <span id="mc">选择模型</span>
            <svg class="chv" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
          <div id="ml"></div>
        </div>
        <button class="ws-btn" id="ws-btn" onclick="toggleWS()" title="联网搜索">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        </button>
        <button class="send-btn" id="sb-btn" onclick="send()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div id="cmp">
    <div id="cmp-ms">
      <div class="cml"><span>选择对比模型</span><span id="cmp-count">已选 0 / 4</span></div>
      <div id="mt"></div>
    </div>
    <div id="cmp-res"></div>
    <div id="cmp-ia">
      <textarea id="cmp-in" placeholder="同一问题，同时发给多个模型…（最多 4 个）" rows="2" onkeydown="onCmpKey(event)"></textarea>
      <button class="cmp-send" onclick="runCmp()" id="cmp-btn">开始对比</button>
    </div>
  </div>

  <div id="stb"><div class="dot" id="stb-dot"></div><span id="stb-txt">未配置 · 点击 ⚙ 设置</span></div>
</div>

<div id="ov" onclick="closeSt(event)">
  <div class="sp">
    <div class="sp-title">配置 <span>Z Chat</span></div>
    <div class="fg">
      <label class="fl">中转站地址 Base URL</label>
      <input type="text" class="fi" id="su" placeholder="https://api.example.com">
      <div class="fi-hint">不含 /v1，如 https://api.b.ai</div>
    </div>
    <div class="fg">
      <label class="fl">API Key</label>
      <input type="password" class="fi" id="sk" placeholder="sk-...">
    </div>
    <div class="sp-ft">
      <button class="cn-btn" onclick="closeSt()">取消</button>
      <button class="sv-btn" onclick="saveSt()">保存并连接</button>
    </div>
  </div>
</div>

<div id="drag-overlay">
  <div class="drag-icon">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
  </div>
  <div class="drag-text">松手即可添加图片</div>
</div>

<script>
if(typeof pdfjsLib!=='undefined')pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const S={url:'',key:'',models:[],sel:'',convs:[],cid:null,mode:'chat',busy:false,cmpModels:[],cmpBusy:false,webSearch:false,files:[],composing:false,abortCtrl:null};

function load(){
  S.url=ls('gw_url')||'';S.key=ls('gw_key')||'';S.sel=ls('gw_sel')||'';
  try{S.convs=JSON.parse(ls('gw_cv')||'[]')}catch{}
  try{S.cmpModels=JSON.parse(ls('gw_cms')||'[]')}catch{}
}
function saveCV(){lss('gw_cv',JSON.stringify(S.convs))}
function ls(k){try{return localStorage.getItem(k)}catch{return null}}
function lss(k,v){try{localStorage.setItem(k,v)}catch{}}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function md(s){return typeof marked!=='undefined'?marked.parse(s||''):esc(s||'')}
function el(id){return document.getElementById(id)}
function rsz(t){t.style.height='auto';t.style.height=Math.min(t.scrollHeight,150)+'px'}

function sta(txt,type){
  el('st').textContent=txt;el('stb-txt').textContent=txt;
  const c='dot'+(type==='ok'?' ok':type==='ld'?' ld':type==='err'?' err':'');
  el('dt').className=c;el('stb-dot').className=c;
}

async function fetchModels(){
  if(!S.url){sta('未配置 · 点击 ⚙ 设置','');return}
  sta('连接中…','ld');el('rb').textContent='⟳ 加载…';
  try{
    const h={'Content-Type':'application/json'};if(S.key)h['Authorization']='Bearer '+S.key;
    const r=await fetch(S.url+'/v1/models',{headers:h});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    const list=(d.data||d.models||[]).map(m=>typeof m==='string'?m:(m.id||m.name||'')).filter(Boolean).sort();
    S.models=list;if(!S.sel||!list.includes(S.sel))S.sel=list[0]||'';
    renderPicker();renderTags();
    sta('已连接 · '+list.length+' 个模型','ok');
  }catch(e){sta('连接失败: '+e.message,'err')}
  el('rb').textContent='↻ 刷新';
}

function renderPicker(){
  el('mc').textContent=S.sel||'选择模型';
  const listEl=el('ml');listEl.innerHTML='';
  S.models.forEach(m=>{
    const d=document.createElement('div');d.className='mopt'+(m===S.sel?' on':'');d.textContent=m;
    d.onclick=e=>{e.stopPropagation();S.sel=m;lss('gw_sel',m);renderPicker();closeModel()};
    listEl.appendChild(d);
  });
}

function renderTags(){
  const c=el('mt');c.innerHTML='';
  S.cmpModels=S.cmpModels.filter(m=>S.models.includes(m));
  updateCmpCount();
  S.models.forEach(m=>{
    const on=S.cmpModels.includes(m);
    const tag=document.createElement('div');tag.className='m-tag'+(on?' on':'');
    tag.innerHTML=`<div class="chk">${on?'<svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>':''}</div><span>${esc(m)}</span>`;
    tag.addEventListener('click',()=>{
      const isOn=S.cmpModels.includes(m);
      if(!isOn){if(S.cmpModels.length>=4)return;S.cmpModels.push(m);}
      else S.cmpModels=S.cmpModels.filter(x=>x!==m);
      tag.classList.toggle('on',!isOn);
      tag.querySelector('.chk').innerHTML=!isOn?'<svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>':'';
      lss('gw_cms',JSON.stringify(S.cmpModels));
      updateCmpCount();
    });
    c.appendChild(tag);
  });
}
function updateCmpCount(){const cc=el('cmp-count');if(cc)cc.textContent=`已选 ${S.cmpModels.length} / 4`;}

function setMode(m){
  S.mode=m;
  el('btn-chat').classList.toggle('on',m==='chat');
  el('btn-cmp').classList.toggle('on',m==='cmp');
  // Reset compare view when switching to compare
  if(m==='cmp'){
    const ms=el('cmp-ms');
    ms.style.flex='';ms.style.maxHeight='';ms.style.padding='';ms.style.overflow='';
    el('cmp-res').classList.remove('has-results');el('cmp-res').innerHTML='';
  }
  // Animate pill
  const pill=el('mode-pill');
  const chat=el('btn-chat');const cmp=el('btn-cmp');
  if(pill&&chat&&cmp){
    if(m==='chat'){
      pill.style.left=chat.offsetLeft+'px';
      pill.style.width=chat.offsetWidth+'px';
      pill.style.background='#C4620E';
    }else{
      pill.style.left=cmp.offsetLeft+'px';
      pill.style.width=cmp.offsetWidth+'px';
      pill.style.background='rgba(255,255,255,.9)';
    }
  }
  el('cp').style.display=m==='chat'?'flex':'none';
  el('cmp').style.display=m==='cmp'?'flex':'none';
  el('nb').style.display=m==='chat'?'flex':'none';
}

function togglePlus(e){e.stopPropagation();const o=el('pm').classList.toggle('show');el('pb').classList.toggle('open',o);closeModel()}
function closePlus(){el('pm').classList.remove('show');el('pb').classList.remove('open')}
function toggleModel(e){e.stopPropagation();const o=el('ml').classList.toggle('show');el('mp').classList.toggle('open',o);closePlus()}
function closeModel(){el('ml').classList.remove('show');el('mp').classList.remove('open')}
document.addEventListener('click',()=>{closePlus();closeModel()});

async function onImgSel(e){
  for(const file of Array.from(e.target.files)){
    await new Promise(res=>{
      const r=new FileReader();
      r.onload=ev=>{
        S.files.push({type:'image',base64:ev.target.result.split(',')[1],mime:file.type,name:file.name,previewUrl:ev.target.result});
        renderFiles();res();
      };r.readAsDataURL(file);
    });
  }
  e.target.value='';
}

async function onPdfSel(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=async ev=>{
    const b64=ev.target.result.split(',')[1];let text='';
    if(typeof pdfjsLib!=='undefined'){
      try{
        const bin=atob(b64),bytes=new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
        const pdf=await pdfjsLib.getDocument({data:bytes}).promise;
        for(let i=1;i<=Math.min(pdf.numPages,30);i++){
          const pg=await pdf.getPage(i);const ct=await pg.getTextContent();
          text+=ct.items.map(x=>x.str).join(' ')+'\n';
        }
      }catch{text='[解析失败]'}
    }else text='[PDF.js未加载]';
    S.files.push({type:'pdf',base64:b64,mime:file.type,name:file.name,text});renderFiles();
  };
  r.readAsDataURL(file);e.target.value='';
}

function removeFile(i){S.files.splice(i,1);renderFiles()}

function renderFiles(){
  const c=el('files-preview');
  if(!S.files.length){c.innerHTML='';c.classList.remove('show');return}
  c.classList.add('show');c.innerHTML='';
  S.files.forEach((f,i)=>{
    const chip=document.createElement('div');chip.className='fchip';
    if(f.type==='image')chip.innerHTML=`<img class="fchip-img" src="${f.previewUrl}"><span class="fchip-name">${esc(f.name)}</span><button class="fchip-rm" onclick="removeFile(${i})">✕</button>`;
    else chip.innerHTML=`<div class="fchip-icon">📄</div><span class="fchip-name">${esc(f.name)}</span><button class="fchip-rm" onclick="removeFile(${i})">✕</button>`;
    c.appendChild(chip);
  });
}

function toggleWS(){S.webSearch=!S.webSearch;el('ws-btn').classList.toggle('on',S.webSearch)}

function newCV(){
  const id=Date.now().toString();
  S.convs.unshift({id,title:'新对话',model:S.sel,messages:[],summary:null});
  S.cid=id;renderCVList();renderChat();updateHdr();saveCV();
}
function selCV(id){S.cid=id;renderCVList();renderChat();updateHdr()}
function delCV(id,e){
  e.stopPropagation();S.convs=S.convs.filter(c=>c.id!==id);
  if(S.cid===id)S.cid=S.convs[0]?.id||null;
  renderCVList();renderChat();updateHdr();saveCV();
}
function getCV(){return S.convs.find(c=>c.id===S.cid)}

function renderCVList(){
  const list=el('cv-list');list.innerHTML='';
  S.convs.forEach(cv=>{
    const d=document.createElement('div');d.className='cv-item'+(cv.id===S.cid?' on':'');d.onclick=()=>selCV(cv.id);
    d.innerHTML=`<span style="flex:1;overflow:hidden;text-overflow:ellipsis">${esc(cv.title)}</span><button class="cv-del" onclick="delCV('${cv.id}',event)">✕</button>`;
    list.appendChild(d);
  });
}

function updateHdr(){
  const cv=getCV(),h=el('hdr-summary');
  if(cv&&cv.summary){h.textContent=cv.summary;h.className='active'}
  else{h.textContent='';h.className=''}
}

async function genSummary(cv){
  if(cv.summary||!S.url)return;
  try{
    const h={'Content-Type':'application/json'};if(S.key)h['Authorization']='Bearer '+S.key;
    const msgs=cv.messages.slice(0,4).map(m=>({role:m.role,content:typeof m.content==='string'?m.content:(m.content||'')}));
    msgs.push({role:'user',content:'请用不超过12个字总结以上对话的主题，只输出文字，不要标点符号。'});
    const res=await fetch(S.url+'/v1/chat/completions',{method:'POST',headers:h,
      body:JSON.stringify({model:cv.model||S.sel||S.models[0],messages:msgs,stream:false,max_tokens:20})});
    const data=await res.json();
    const s=(data.choices?.[0]?.message?.content||'').trim().replace(/[。，、！？.!?,]/g,'').slice(0,15);
    if(s){cv.summary=s;cv.title=s;renderCVList();updateHdr();saveCV()}
  }catch{}
}

function renderChat(){
  const ca=el('ca'),cv=getCV();
  if(!cv||!cv.messages.length){
    ca.innerHTML=`<div class="empty"><div class="empty-t">${cv?'发送消息开始对话':'选择或新建对话'}</div></div>`;return;
  }
  ca.innerHTML='';
  cv.messages.forEach((msg,i)=>{
    const d=document.createElement('div');d.className='msg '+msg.role;d.id='msg'+i;
    const lbl=msg.role==='user'?'你':(cv.model||'助手');
    let body='';
    if(msg.role==='assistant'){body=md(msg.content||'')+(msg.streaming?'<span class="cur"></span>':'')}
    else{
      body='<p>'+esc(msg.content||'')+'</p>';
      if(msg.imgs&&msg.imgs.length)body+=`<div class="msg-imgs">${msg.imgs.map(s=>`<img class="msg-img" src="${s}">`).join('')}</div>`;
      if(msg.pdfs&&msg.pdfs.length)body+=msg.pdfs.map(f=>`<div class="msg-file">📄 ${esc(f)}</div>`).join('');
    }
    d.innerHTML=`<div class="msg-lbl">${esc(lbl)}</div><div class="msg-b">${body}</div>`;
    // Edit button on user messages
    if(msg.role==='user'){
      const eb=document.createElement('button');
      eb.className='edit-btn'+(msg.editable?' visible':'');
      eb.textContent='✏ 修改';
      eb.onclick=()=>editMsg(i);
      d.appendChild(eb);
    }
    ca.appendChild(d);
  });
  ca.scrollTop=ca.scrollHeight;
}

// Stop generation
function stopGen(){
  if(S.abortCtrl)S.abortCtrl.abort();
}

// Edit a user message: restore text to input, remove from that point onward
function editMsg(i){
  const cv=getCV();if(!cv)return;
  const msg=cv.messages[i];
  el('mi').value=msg.content||'';rsz(el('mi'));
  cv.messages.splice(i); // remove this msg and everything after
  renderChat();saveCV();
  el('mi').focus();
}

// Toggle send button between send and stop modes
function setSendBtn(mode){
  const btn=el('sb-btn');
  if(mode==='stop'){
    btn.classList.add('stop');btn.disabled=false;
    btn.innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" fill="white"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>`;
    btn.onclick=stopGen;
  }else{
    btn.classList.remove('stop');btn.disabled=false;
    btn.innerHTML=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>`;
    btn.onclick=send;
  }
}

async function send(){
  if(S.busy)return;
  const txt=el('mi').value.trim();
  if(!txt&&!S.files.length)return;
  if(!S.url){openSt();return}
  if(!S.sel){alert('请先选择模型');return}

  if(!S.cid)newCV();
  const cv=getCV();if(!cv)return;
  const first=cv.messages.length===0;
  if(first){cv.title=txt.slice(0,32)||(S.files[0]?.name||'新对话');cv.model=S.sel}

  const fs=S.files.slice();
  const parts=[];
  if(txt)parts.push({type:'text',text:txt});
  fs.forEach(f=>{
    if(f.type==='image')parts.push({type:'image_url',image_url:{url:`data:${f.mime};base64,${f.base64}`}});
    else parts.push({type:'text',text:`[附件: ${f.name}]\n${f.text}`});
  });
  const apiContent=parts.length===1&&parts[0].type==='text'?parts[0].text:parts;

  const history=cv.messages.map(m=>({role:m.role,content:m.content||''}));
  cv.messages.push({role:'user',content:txt||'（附件）',imgs:fs.filter(f=>f.type==='image').map(f=>f.previewUrl),pdfs:fs.filter(f=>f.type==='pdf').map(f=>f.name)});
  cv.messages.push({role:'assistant',content:'',streaming:true});

  el('mi').value='';rsz(el('mi'));S.files=[];renderFiles();
  renderChat();renderCVList();
  S.busy=true;setSendBtn('stop');

  try{
    const h={'Content-Type':'application/json'};if(S.key)h['Authorization']='Bearer '+S.key;
    const body={model:S.sel,messages:[...history,{role:'user',content:apiContent}],stream:true};
    if(S.webSearch)body.web_search_options={search_context_size:'medium'};
    S.abortCtrl=new AbortController();
    const res=await fetch(S.url+'/v1/chat/completions',{method:'POST',headers:h,body:JSON.stringify(body),signal:S.abortCtrl.signal});
    if(!res.ok){const e=await res.text();throw new Error('HTTP '+res.status+': '+e.slice(0,120))}

    const reader=res.body.getReader(),dec=new TextDecoder();
    let buf='',ans='',prev=0;
    const li=cv.messages.length-1;
    while(true){
      const{done,value}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop()||'';
      for(const line of lines){
        if(!line.startsWith('data: '))continue;
        const d=line.slice(6).trim();if(d==='[DONE]')continue;
        try{
          const p=JSON.parse(d);ans+=(p.choices?.[0]?.delta?.content||'');cv.messages[li].content=ans;
          const bbl=el('ca')?.querySelector('#msg'+li+' .msg-b');
          if(bbl&&ans.length>prev){
            const np=ans.slice(prev);const cur=bbl.querySelector('.cur');if(cur)bbl.removeChild(cur);
            const sp=document.createElement('span');sp.className='ci';sp.textContent=np;bbl.appendChild(sp);
            const cr=document.createElement('span');cr.className='cur';bbl.appendChild(cr);
            prev=ans.length;el('ca').scrollTop=el('ca').scrollHeight;
          }
        }catch{}
      }
    }
    cv.messages[li].streaming=false;
    const bbl=el('ca')?.querySelector('#msg'+li+' .msg-b');
    if(bbl){bbl.innerHTML=md(ans);bbl.classList.add('md-done')}
    el('ca').scrollTop=el('ca').scrollHeight;
    saveCV();if(first)genSummary(cv);
  }catch(e){
    const li=cv.messages.length-1;
    const aborted=e.name==='AbortError';
    if(aborted){
      // Keep partial response, finalize it
      const ans=cv.messages[li]?.content||'';
      cv.messages[li].streaming=false;
      const bbl=el('ca')?.querySelector('#msg'+li+' .msg-b');
      if(bbl)bbl.innerHTML=(ans?md(ans):'<span style="color:var(--txt3);font-size:13px">（已停止）</span>');
      // Mark last user message as editable
      const userIdx=li-1;
      if(userIdx>=0&&cv.messages[userIdx]?.role==='user')cv.messages[userIdx].editable=true;
      saveCV();renderChat();
    }else{
      cv.messages[li].content='[错误] '+e.message;cv.messages[li].streaming=false;renderChat();
    }
  }
  S.busy=false;S.abortCtrl=null;setSendBtn('send');
}

async function runCmp(){
  if(S.cmpBusy)return;
  const prompt=el('cmp-in').value.trim();if(!prompt)return;
  if(!S.cmpModels.length){alert('请至少选择一个模型');return}
  if(!S.url){openSt();return}
  S.cmpBusy=true;el('cmp-btn').disabled=true;
  // Show results, collapse model selector
  const resEl=el('cmp-res');
  resEl.innerHTML='';resEl.classList.add('has-results');
  el('cmp-ms').style.flex='0 0 auto';el('cmp-ms').style.maxHeight='0';el('cmp-ms').style.padding='0';el('cmp-ms').style.overflow='hidden';
  const cols={};
  S.cmpModels.forEach(m=>{
    const col=document.createElement('div');col.className='cc';
    const cid='c_'+m.replace(/[^a-z0-9]/gi,'_');
    col.innerHTML=`<div class="cc-h">${esc(m)}</div><div class="cc-b" id="${cid}"><span style="color:var(--txt3);font-size:12px">生成中…</span></div>`;
    resEl.appendChild(col);cols[m]=cid;
  });
  await Promise.all(S.cmpModels.map(async m=>{
    const cid=cols[m];let txt='';
    try{
      const h={'Content-Type':'application/json'};if(S.key)h['Authorization']='Bearer '+S.key;
      const r=await fetch(S.url+'/v1/chat/completions',{method:'POST',headers:h,body:JSON.stringify({model:m,messages:[{role:'user',content:prompt}],stream:true})});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const reader=r.body.getReader(),dec=new TextDecoder();let buf='';
      while(true){
        const{done,value}=await reader.read();if(done)break;
        buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop()||'';
        for(const line of lines){
          if(!line.startsWith('data: '))continue;const d=line.slice(6).trim();if(d==='[DONE]')continue;
          try{txt+=JSON.parse(d).choices?.[0]?.delta?.content||'';const e=el(cid);if(e){e.innerHTML=md(txt);e.scrollTop=e.scrollHeight}}catch{}
        }
      }
    }catch(e){const c=el(cid);if(c)c.innerHTML=`<span style="color:var(--danger)">[错误] ${esc(e.message)}</span>`}
  }));
  S.cmpBusy=false;el('cmp-btn').disabled=false;
}

function onKey(e){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&!S.composing){e.preventDefault();send()}}
function onCmpKey(e){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();runCmp()}}
el('mi').addEventListener('compositionstart',()=>S.composing=true);
el('mi').addEventListener('compositionend',()=>setTimeout(()=>S.composing=false,80));

// Paste image from clipboard
el('mi').addEventListener('paste',e=>{
  const items=Array.from(e.clipboardData?.items||[]);
  const imgItems=items.filter(it=>it.type.startsWith('image/'));
  if(!imgItems.length)return;
  e.preventDefault();
  imgItems.forEach(item=>{
    const file=item.getAsFile();if(!file)return;
    const r=new FileReader();
    r.onload=ev=>{
      S.files.push({type:'image',base64:ev.target.result.split(',')[1],mime:file.type,name:'粘贴的图片',previewUrl:ev.target.result});
      renderFiles();
    };
    r.readAsDataURL(file);
  });
});

function openSt(){el('su').value=S.url;el('sk').value=S.key;el('ov').classList.add('on')}
function closeSt(e){if(!e||e.target===el('ov'))el('ov').classList.remove('on')}
function saveSt(){
  S.url=el('su').value.trim().replace(/\/+$/,'');S.key=el('sk').value.trim();
  lss('gw_url',S.url);lss('gw_key',S.key);
  el('ov').classList.remove('on');fetchModels();
}

load();renderCVList();
if(S.cid&&getCV())renderChat();
updateHdr();

// Time-based greeting
(function(){
  const h=new Date().getHours();
  const g=h>=5&&h<9?'早上好 ☀️':h>=9&&h<12?'上午好':h>=12&&h<14?'中午好 🌤':h>=14&&h<18?'下午好':h>=18&&h<23?'晚上好 🌙':'夜深了，注意休息';
  const el_g=el('greeting');if(el_g)el_g.textContent=g;
})();

// ── Drag & drop images ──
let dragCount=0;
document.addEventListener('dragenter',e=>{
  if([...e.dataTransfer.types].includes('Files')){dragCount++;el('drag-overlay').classList.add('show')}
});
document.addEventListener('dragleave',()=>{
  dragCount--;if(dragCount<=0){dragCount=0;el('drag-overlay').classList.remove('show')}
});
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{
  e.preventDefault();dragCount=0;el('drag-overlay').classList.remove('show');
  const files=Array.from(e.dataTransfer.files).filter(f=>f.type.startsWith('image/'));
  files.forEach(file=>{
    const r=new FileReader();
    r.onload=ev=>{
      S.files.push({type:'image',base64:ev.target.result.split(',')[1],mime:file.type,name:file.name,previewUrl:ev.target.result});
      renderFiles();
    };
    r.readAsDataURL(file);
  });
  if(files.length&&S.mode==='chat')el('mi').focus();
});

if(S.url)fetchModels();else sta('未配置 · 点击 ⚙ 设置','');
setMode('chat');
requestAnimationFrame(()=>setMode('chat'));
</script>
